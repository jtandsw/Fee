# ============================================================
# 大学生缴费管理系统 · docker-compose（README 11.4 打包部署 简版）
#
# 使用前提（先本地构建产物，容器只负责运行，避免镜像内再装 Maven/Node）：
#   cd frontend && npm run build                    # → frontend/dist
#   cd backend  && mvn clean package -DskipTests    # → backend/target/campus-payment-1.0.0.jar
#
# 启动：
#   docker compose -f deploy/docker-compose.yml up -d
#   访问 http://localhost
#
# 停止 / 清库：
#   docker compose -f deploy/docker-compose.yml down
#   docker compose -f deploy/docker-compose.yml down -v
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: campus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-campus@2026}
      MYSQL_DATABASE: campus_payment
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行；schema.sql 自带 DROP/CREATE DATABASE，顺序由文件名前缀保证
      - ../backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../backend/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-campus@2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: eclipse-temurin:17-jre
    container_name: campus-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/campus_payment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-campus@2026}
      # 生产必须替换为 32 字节以上的随机串
      JWT_SECRET: ${JWT_SECRET:-please-change-this-jwt-secret-in-production-env}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      TZ: Asia/Shanghai
    command: ["java", "-Xms256m", "-Xmx512m", "-Duser.timezone=Asia/Shanghai", "-jar", "/app/app.jar"]
    volumes:
      - ../backend/target/campus-payment-1.0.0.jar:/app/app.jar:ro
      - backend-uploads:/app/uploads
    expose:
      - "8080"

  web:
    image: nginx:1.25-alpine
    container_name: campus-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  backend-uploads:
