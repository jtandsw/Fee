# ============================================================
# 大学生缴费管理系统 · Nginx 配置（README 11.4 打包部署）
# 挂载位置：/etc/nginx/nginx.conf
# 作用：1) 托管 frontend/dist 静态资源  2) 反向代理 /api → 后端 8080
# ============================================================
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" $request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # 前端构建产物以 hash 命名，静态资源长缓存；index.html 不缓存
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # 对账账单上传（README 10.4），与后端 multipart 上限保持一致
    client_max_body_size 20m;

    upstream campus_payment_backend {
        server backend:8080;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ---------- 前端 SPA ----------
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ---------- 后端接口 ----------
        location /api/ {
            proxy_pass         http://campus_payment_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # 对账账单文件下载（WebMvcConfig 的 /files/** 映射）
        location /files/ {
            proxy_pass         http://campus_payment_backend/files/;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Swagger 文档（生产建议关闭）
        location ~ ^/(swagger-ui|v3/api-docs) {
            proxy_pass         http://campus_payment_backend;
            proxy_set_header   Host $host;
        }

        # 健康检查（供 LB / 监控探测）
        location = /healthz {
            access_log off;
            proxy_pass http://campus_payment_backend/api/actuator/health;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
